# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which the JVM
# cannot even reserve on this machine (~15 GB total, under 1 GB typically free
# with an IDE running) — the build dies with "insufficient memory for the Java
# Runtime Environment to continue" before compiling anything.
#
# 1.5 GB is comfortably enough for a project this size. Raise it if a build
# ever fails with a genuine Java heap OutOfMemoryError, which is a different
# message from the native allocation failure above.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Serial execution, for the same reason: parallel workers each take a JVM.
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
